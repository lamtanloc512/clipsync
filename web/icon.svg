<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ClipSync app icon. Source of AppIcon.icns and the web icons (assets/make-icons.py). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="sync" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  </g>
  <g filter="url(#soft)">
    <rect x="300" y="262" width="424" height="534" rx="64" fill="url(#board)"/>
  </g>
  <rect x="404" y="218" width="216" height="104" rx="32" fill="#3f3f46"/>
  <rect x="452" y="246" width="120" height="30" rx="15" fill="#18181b"/>
  <g fill="none" stroke="url(#sync)" stroke-width="40" stroke-linecap="round">
    <path d="M405.5 513.4 A112 112 0 0 1 595.2 473.1"/>
    <path d="M618.5 582.6 A112 112 0 0 1 428.8 622.9"/>
  </g>
  <g fill="url(#sync)">
    <path d="M630.2 511.8 L627.6 444.0 L562.9 502.2 Z"/>
    <path d="M393.8 584.2 L396.4 652.0 L461.1 593.8 Z"/>
  </g>
</svg>
