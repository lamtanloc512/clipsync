name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (e.g. 1.0.0). Leave empty for a test build."
        required: false
        default: ""

# Read-only by default; only the release job can write (to publish the release).
permissions:
  contents: read

jobs:
  # The phone client is compiled (Tailwind + Basecoat Lyra) into WebAssets.generated.swift;
  # make sure the committed file matches web/.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.22.0   # pinned: gzip output must match the committed file
      - name: Rebuild web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Generated file is up to date
        run: git diff --exit-code -- Sources/ClipSync/WebAssets.generated.swift

  # Builds and tests the app. Never sees signing secrets: releases are signed in the `sign` job.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Unit tests (Web Push encryption, RFC 8291 test vector)
        run: swift test

      - name: Build ClipSync.app
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            export VERSION="$INPUT_VERSION"   # validated by build-app.sh
          fi
          ./build-app.sh

      - name: Smoke test (HTTPS server, certificates, security checks)
        run: |
          # A pre-paired test device, so authenticated endpoints can be exercised without the UI.
          TOKEN=ci-test-token-$(uuidgen)
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          mkdir -p ~/Library/Application\ Support/ClipSync
          python3 - "$TOKEN" <<'PY'
          import hashlib, json, os, sys
          path = os.path.expanduser("~/Library/Application Support/ClipSync/devices.json")
          json.dump([{"id": "ci", "name": "CI", "tokenHash": hashlib.sha256(sys.argv[1].encode()).hexdigest(),
                      "pairedAt": 0}], open(path, "w"))
          PY
          ./ClipSync.app/Contents/MacOS/ClipSync > app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true; echo "--- app log"; cat app.log' EXIT
          for i in $(seq 1 30); do curl -sk -o /dev/null https://localhost:8765/ && break; sleep 1; done
          URL=https://localhost:8765
          status() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }

          echo "--- web client over HTTPS, with security headers and no CORS"
          curl -skf -D headers.txt $URL/ | grep -q "<title>ClipSync</title>"
          grep -i '^content-security-policy:' headers.txt | grep -q "script-src 'self';"
          if grep -qi '^access-control-allow-origin' headers.txt; then echo 'CORS header present'; exit 1; fi

          echo "--- CSS/JS arrive complete over a slow link, plain and gzip (v1.1.0 truncated them)"
          ( set -o pipefail
          for asset in app.css app.js; do
            ver=$(curl -skf $URL/ | grep -o "/$asset?v=[0-9a-f]*" | cut -d= -f2)
            test -n "$ver"
            curl -skf --limit-rate 40k -D plain.h "$URL/$asset?v=$ver" -o "plain-$asset"
            curl -skf --limit-rate 40k -D gz.h --compressed "$URL/$asset?v=$ver" -o "gz-$asset"
            grep -qi '^content-encoding: gzip' gz.h
            test "$(grep -i '^content-length:' plain.h | tr -dc 0-9)" = "$(wc -c < plain-$asset | tr -dc 0-9)"
            cmp "plain-$asset" "gz-$asset"
            echo "$asset: $(wc -c < plain-$asset) bytes, gzip $(grep -i '^content-length:' gz.h | tr -dc 0-9) bytes"
          done
          grep -q '\.btn' plain-app.css
          grep -q 'ClipSync phone client' plain-app.js )
          curl -skf $URL/manifest.webmanifest | python3 -c 'import json,sys; m=json.load(sys.stdin); assert m["share_target"]["action"]=="/share-target" and m["display"]=="standalone", m'

          echo "--- PWA: service worker is served; shares without an active worker bounce back unread"
          curl -skf -D sw.h $URL/sw.js | grep -q "clipsync-shell-"
          grep -qi '^content-type: text/javascript' sw.h
          grep -i '^content-security-policy:' headers.txt | grep -q "worker-src 'self'"
          test "$(curl -sk -o /dev/null -w '%{http_code} %{redirect_url}' -X POST -F files=@/etc/hosts $URL/share-target)" = "303 $URL/?share-unavailable=1"

          echo "--- app icon is bundled and the web icons are served"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' ClipSync.app/Contents/Info.plist)" = AppIcon
          file ClipSync.app/Contents/Resources/AppIcon.icns | grep -q 'Mac OS X icon'
          for icon in icon-180 icon-192 icon-512 icon-maskable-512; do
            curl -skf $URL/$icon.png -o $icon.png && file $icon.png | grep -q 'PNG image'
          done


          echo "--- certificate chain validates against the ClipSync CA"
          curl -skf $URL/ca.crt -o ca.der
          openssl x509 -inform DER -in ca.der -out ca.pem
          openssl x509 -in ca.pem -noout -subject -ext extendedKeyUsage,nameConstraints
          echo | openssl s_client -connect localhost:8765 -servername localhost 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName
          curl -sf --cacert ca.pem -o /dev/null $URL/

          echo "--- clipsync.local is published over mDNS and covered by the certificate"
          # mDNS on CI VMs is unreliable, so a lookup failure is reported but doesn't block the build.
          # The certificate always has to cover the name.
          openssl x509 -in <(echo | openssl s_client -connect localhost:8765 -servername localhost 2>/dev/null) \
            -noout -ext subjectAltName | grep -q 'DNS:clipsync.local'
          resolved=""
          for i in $(seq 1 10); do
            resolved=$(perl -e 'alarm 3; exec @ARGV' dscacheutil -q host -a name clipsync.local | grep ip_address || true)
            [ -n "$resolved" ] && break; sleep 1
          done
          if [ -n "$resolved" ]; then
            echo "$resolved"
            curl -sf --max-time 10 --cacert ca.pem -o /dev/null https://clipsync.local:8765/
          else
            echo "::warning::clipsync.local did not resolve over mDNS on this runner"
          fi

          echo "--- API requires pairing; token in the URL is not accepted"
          test "$(status $URL/api/clipboard)" = 401
          test "$(status "$URL/api/clipboard?token=anything")" = 401

          echo "--- unauthenticated uploads are refused before the body is read"
          head -c 5000000 /dev/zero > big.bin
          test "$(status -X POST --data-binary @big.bin $URL/api/clipboard)" = 401

          echo "--- pairing needs the one-time QR secret"
          test "$(status -X POST -H 'Content-Type: application/json' -d '{"name":"CI"}' $URL/api/pair)" = 403
          test "$(status -X POST -H 'Content-Type: application/json' -d '{"name":"CI","secret":"guess"}' $URL/api/pair)" = 403

          echo "--- cross-origin requests and foreign Host headers are refused"
          test "$(status -X POST -H 'Origin: https://evil.example' -H 'Content-Type: application/json' -d '{}' $URL/api/pair)" = 403
          test "$(status -H 'Host: evil.example' $URL/)" = 400

          echo "--- file transfer: 300 MB upload is streamed to disk, not memory"
          ( set -o pipefail
          head -c 314572800 /dev/urandom > big.bin
          want=$(shasum -a 256 big.bin | cut -c1-64)
          peak=0
          ( while kill -0 $APP_PID 2>/dev/null; do ps -o rss= -p $APP_PID; sleep 0.2; done ) > rss.log &
          SAMPLER=$!
          curl -skf -H "X-Token: $TOKEN" -H "X-Filename: big%20video.mov" -H "Content-Type: video/quicktime" \
            --data-binary @big.bin $URL/api/files | tee upload.json
          kill $SAMPLER 2>/dev/null || true
          peak=$(sort -n rss.log | tail -1)
          echo "peak RSS during upload: $((peak / 1024)) MB"
          test "$peak" -lt 262144   # < 256 MB while receiving 300 MB
          saved=~/Downloads/"big video.mov"
          test "$(shasum -a 256 "$saved" | cut -c1-64)" = "$want"
          xattr -p com.apple.quarantine "$saved" | grep -q ClipSync
          ls ~/Downloads/.clipsync-*.part 2>/dev/null && { echo "partial upload left behind"; exit 1; } || true

          echo "--- the file becomes a clipboard item phones can download via a ticket"
          info=$(curl -skf -H "X-Token: $TOKEN" $URL/api/clipboard)
          echo "$info" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["kind"]=="file" and d["text"]=="big video.mov" and d["size"]==314572800, d'
          id=$(echo "$info" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          dl=$(curl -skf -X POST -H "X-Token: $TOKEN" "$URL/api/files/ticket?id=$id" | python3 -c 'import json,sys; print(json.load(sys.stdin)["url"])')
          curl -skf -D dl.h "$URL$dl" -o downloaded.bin
          grep -qi '^content-disposition: attachment' dl.h
          test "$(shasum -a 256 downloaded.bin | cut -c1-64)" = "$want"
          echo "--- downloads support HEAD and byte ranges (download managers resume with them)"
          curl -skf -I "$URL$dl" > head.h
          grep -qi '^content-length: 314572800' head.h
          grep -qi '^accept-ranges: bytes' head.h
          test "$(curl -sk -r 1000-1999 -D range.h -o part.bin -w '%{http_code}' "$URL$dl")" = 206
          grep -qi '^content-range: bytes 1000-1999/314572800' range.h
          test "$(wc -c < part.bin | tr -d ' ')" = 1000
          cmp part.bin <(tail -c +1001 big.bin | head -c 1000)
          test "$(curl -sk -r 314572700- -o tail.bin -w '%{http_code}' "$URL$dl")" = 206
          test "$(wc -c < tail.bin | tr -d ' ')" = 100
          test "$(curl -sk -r 999999999- -o /dev/null -w '%{http_code}' "$URL$dl")" = 416
          test "$(status "$URL/dl/not-a-ticket/x")" = 410
          test "$(status -X POST "$URL/api/files/ticket?id=$id")" = 401

          echo "--- unauthenticated uploads are refused, file names are sanitised"
          test "$(status -X POST -H 'X-Filename: x' --data-binary @big.bin $URL/api/files)" = 401
          echo hello > small.txt
          curl -skf -H "X-Token: $TOKEN" -H "X-Filename: ..%2F..%2Fevil.sh" --data-binary @small.txt $URL/api/files
          test -f ~/Downloads/evil.sh
          test ! -e ~/evil.sh

          echo "--- a file copied in Finder is offered to phones"
          echo "from finder" > ~/finder-copy.txt
          osascript -e 'set the clipboard to (POSIX file "'"$HOME"'/finder-copy.txt")'
          sleep 1.5
          curl -skf -H "X-Token: $TOKEN" $URL/api/clipboard | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["kind"]=="file" and d["text"]=="finder-copy.txt", d'
          rm -f big.bin downloaded.bin )

          echo "--- Web Push: VAPID key served, only real push services accepted"
          curl -skf -H "X-Token: $TOKEN" $URL/api/push/key | python3 -c '
          import base64, json, sys
          key = json.load(sys.stdin)["key"]
          raw = base64.urlsafe_b64decode(key + "=" * (-len(key) % 4))
          assert len(raw) == 65 and raw[0] == 4, len(raw)'
          test "$(status $URL/api/push/key)" = 401
          sub() { status -X POST -H "X-Token: $TOKEN" -H 'Content-Type: application/json' -d "$1" $URL/api/push/subscribe; }
          GOODKEY=BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4
          test "$(sub '{"endpoint":"https://evil.example/push","keys":{"p256dh":"'$GOODKEY'","auth":"BTBZMqHH6r4Tts7J_aSIgg"}}')" = 400
          test "$(sub '{"endpoint":"http://fcm.googleapis.com/fcm/send/x","keys":{"p256dh":"'$GOODKEY'","auth":"BTBZMqHH6r4Tts7J_aSIgg"}}')" = 400
          test "$(sub '{"endpoint":"https://fcm.googleapis.com/fcm/send/x","keys":{"p256dh":"bad","auth":"BTBZMqHH6r4Tts7J_aSIgg"}}')" = 400
          test "$(status -X POST -H "X-Token: $TOKEN" -H 'Content-Type: application/json' -d '{"visible":false}' $URL/api/presence)" = 204
          test "$(status -X POST -H "X-Token: $TOKEN" $URL/api/push/unsubscribe)" = 200

          echo "--- iOS profile is a valid plist"
          curl -skf $URL/ca.mobileconfig -o profile.mobileconfig
          plutil -lint profile.mobileconfig

      - name: Package
        run: |
          ditto -c -k --keepParent ClipSync.app ClipSync-macOS.zip
          shasum -a 256 ClipSync-macOS.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ClipSync-macOS
          path: |
            ClipSync-macOS.zip
            SHA256SUMS.txt

  # Signs the tested build with Developer ID and notarizes it. The only job that can read the
  # signing secrets: they live in the `release` environment, which only main and v* tags may use
  # (Settings → Environments → release). Third-party code here is limited to SHA-pinned
  # official actions.
  sign:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: macos-15
    environment: release
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY_P8 != '' }}
      # Only this team's Developer ID may sign releases (public: it is visible in every signed app).
      APPLE_TEAM_ID: MQT3MB6VWY
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ClipSync-macOS

      - name: Unpack the tested build
        run: |
          shasum -a 256 -c SHA256SUMS.txt
          ditto -x -k ClipSync-macOS.zip .
          rm ClipSync-macOS.zip SHA256SUMS.txt

      - name: Warn about an unsigned release
        if: env.HAS_SIGNING != 'true'
        run: echo "::warning::Signing secrets are not set in the 'release' environment, so this release is ad-hoc signed and macOS will ask users to approve it. See CONTRIBUTING.md → Releasing."

      - name: Sign with Developer ID
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o "\"Developer ID Application: [^\"]*($APPLE_TEAM_ID)\"" | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 has no 'Developer ID Application' identity for team $APPLE_TEAM_ID"; exit 1
          fi
          echo "Signing as: $IDENTITY"
          # Hardened runtime + secure timestamp, as notarization requires.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" ClipSync.app
          codesign --verify --strict --verbose=2 ClipSync.app
          codesign -dv ClipSync.app 2>&1 | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"

      - name: Notarize and staple
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          # Accept the .p8 either as-is or base64-encoded.
          if printf '%s' "$NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$NOTARY_KEY" > "$KEY"
          else
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$KEY"
          fi
          ditto -c -k --keepParent ClipSync.app notarize.zip
          xcrun notarytool submit notarize.zip --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m --output-format json | tee notary.json
          rm -f "$KEY" notarize.zip
          python3 -c 'import json; s=json.load(open("notary.json"))["status"]; print("status:", s); assert s == "Accepted", s'
          xcrun stapler staple ClipSync.app
          xcrun stapler validate ClipSync.app
          spctl --assess --type execute --verbose=2 ClipSync.app

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Package
        run: |
          ditto -c -k --keepParent ClipSync.app ClipSync-macOS.zip
          shasum -a 256 ClipSync-macOS.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ClipSync-release
          path: |
            ClipSync-macOS.zip
            SHA256SUMS.txt

  # Runs for a pushed v* tag, or for "Run workflow" with a version (which creates the tag).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ClipSync-release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c SHA256SUMS.txt
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            [[ "$INPUT_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "Invalid version: $INPUT_VERSION"; exit 1; }
            TAG="v$INPUT_VERSION"
          fi
          # --target creates the tag on the built commit if it doesn't exist yet.
          gh release create "$TAG" ClipSync-macOS.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "ClipSync $TAG" --generate-notes
